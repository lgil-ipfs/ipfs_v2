<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Policy Status | Iberian Pacific</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6B1E1E;
            --accent: #C9A84C;
            --bg-color: #FAF8F5;
            --text-main: #333333;
            --text-light: #666666;
            --border: #E5E0D8;
            
            --font-heading: 'Cormorant Garamond', serif;
            --font-body: 'Jost', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Password Gate */
        #password-gate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .gate-content {
            text-align: center;
            max-width: 400px;
            width: 90%;
            padding: 50px 40px;
            background: #FFFFFF;
            border: 1px solid var(--border);
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
        }

        .gate-title {
            font-family: var(--font-heading);
            color: var(--primary);
            font-size: 2.2rem;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .password-input-wrapper {
            margin-bottom: 20px;
            position: relative;
        }

        #password-input {
            width: 100%;
            padding: 14px 16px;
            font-family: var(--font-body);
            font-size: 1rem;
            border: 1px solid var(--border);
            background-color: var(--bg-color);
            outline: none;
            transition: border-color 0.3s ease;
            text-align: center;
            letter-spacing: 0.1em;
        }

        #password-input:focus {
            border-color: var(--accent);
        }

        #submit-btn {
            background-color: var(--primary);
            color: #FFFFFF;
            border: none;
            padding: 14px 24px;
            font-family: var(--font-body);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        #submit-btn:hover {
            background-color: #521717;
        }

        .error-msg {
            color: #c62828;
            font-size: 0.85rem;
            margin-top: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }

        .shake {
            animation: shake 0.4s;
        }

        /* Main App */
        #app-content {
            display: none;
            flex: 1;
            max-width: 700px;
            margin: 0 auto;
            width: 100%;
            padding: 80px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 70px;
        }

        .wordmark {
            font-family: var(--font-heading);
            font-size: 2.8rem;
            color: var(--primary);
            letter-spacing: 0.02em;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-light);
            font-weight: 300;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .divider {
            height: 1px;
            background-color: var(--accent);
            width: 80px;
            margin: 24px auto 0;
        }

        /* Pipeline Styles */
        .pipeline-container {
            position: relative;
            padding-left: 30px;
        }

        .pipeline-container::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 9px;
            width: 1px;
            background-color: var(--border);
        }

        .stage-item {
            position: relative;
            margin-bottom: 40px;
            background: #FFFFFF;
            padding: 30px;
            border: 1px solid var(--border);
        }

        .stage-item:last-child {
            margin-bottom: 0;
        }

        .stage-marker {
            position: absolute;
            left: -30px;
            top: 35px;
            width: 18px;
            height: 18px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            transform: translateX(-50%);
            z-index: 1;
        }

        .stage-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .stage-name {
            font-family: var(--font-heading);
            font-size: 1.6rem;
            color: var(--primary);
            font-weight: 600;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 6px 12px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border: 1px solid transparent;
        }

        /* Status Colors */
        .status-complete { background-color: #f0fdf4; color: #166534; border-color: #bbf7d0; }
        .status-in-progress { background-color: #fefce8; color: #854d0e; border-color: #fef08a; }
        .status-pending { background-color: #f5f5f5; color: #525252; border-color: #e5e5e5; }
        .status-on-hold { background-color: #fffbeb; color: #b45309; border-color: #fde68a; }
        .status-needs-revision { background-color: #fef2f2; color: #991b1b; border-color: #fecaca; }
        .status-decision-pending { background-color: #eff6ff; color: #1e40af; border-color: #bfdbfe; }

        /* Marker active states */
        .stage-item[data-status="Complete"] .stage-marker { border-color: #22c55e; background-color: #22c55e; }
        .stage-item[data-status="In Progress"] .stage-marker { border-color: var(--accent); background-color: var(--accent); }
        .stage-item[data-status="Pending"] .stage-marker { border-color: #d4d4d4; }
        .stage-item[data-status="On Hold"] .stage-marker { border-color: #f59e0b; }
        .stage-item[data-status="Needs Revision"] .stage-marker { border-color: #ef4444; }
        .stage-item[data-status="Decision Pending"] .stage-marker { border-color: #3b82f6; }

        .stage-meta {
            display: flex;
            gap: 40px;
            font-size: 0.9rem;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
        }

        .meta-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 6px;
            color: var(--text-light);
        }

        .meta-value {
            color: var(--text-main);
            font-weight: 400;
        }

        .advisor-notes {
            background-color: var(--bg-color);
            padding: 20px;
            border-left: 2px solid var(--accent);
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-main);
        }

        .advisor-notes-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            color: var(--text-light);
            display: block;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 50px 20px;
            margin-top: auto;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--text-light);
            line-height: 1.8;
            letter-spacing: 0.02em;
        }

        .footer-name {
            color: var(--primary);
            margin-top: 16px;
        }

        .footer-email {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-email:hover {
            color: var(--primary);
        }

        .loading-state, .error-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
            background: #FFFFFF;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            letter-spacing: 0.02em;
        }

        .error-state {
            color: #991b1b;
        }

        @media (max-width: 600px) {
            #app-content {
                padding: 50px 16px;
            }
            .stage-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .stage-meta {
                gap: 20px;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- Password Gate -->
    <div id="password-gate">
        <div class="gate-content">
            <h1 class="gate-title">Client Access</h1>
            <div class="password-input-wrapper">
                <input type="password" id="password-input" placeholder="ENTER PASSWORD" aria-label="Password">
                <div class="error-msg" id="password-error">Incorrect password</div>
            </div>
            <button id="submit-btn">View Status</button>
        </div>
    </div>

    <!-- Main Content -->
    <div id="app-content">
        <header>
            <div class="wordmark">Iberian Pacific</div>
            <div class="subtitle">Policy Status &mdash; Lucas Gil</div>
            <div class="divider"></div>
        </header>

        <main>
            <div id="pipeline-container" class="pipeline-container">
                <div class="loading-state">Retrieving latest status updates...</div>
            </div>
        </main>
    </div>

    <footer>
        <p>This page is for informational purposes only. For questions contact your advisor.</p>
        <p class="footer-name">Lucas Rodrigues Gil | Iberian Pacific Financial Services Inc.</p>
        <a href="mailto:lgil@iberianpacific.ca" class="footer-email">lgil@iberianpacific.ca</a>
    </footer>

    <script>
        const CLIENT_PASSWORD = "1234LUCASGIL";
        const DATA_URL = "https://script.google.com/macros/s/AKfycbwKGLLvT5yytNzAcvjM1omJtLUxVFd_p0CzMgAWoO2rYAyOtIpzcR4GCuzAqiVDXBItlA/exec?client=LUCAS-GIL";

        document.addEventListener('DOMContentLoaded', () => {
            const gate = document.getElementById('password-gate');
            const app = document.getElementById('app-content');
            const input = document.getElementById('password-input');
            const submitBtn = document.getElementById('submit-btn');
            const errorMsg = document.getElementById('password-error');

            // Check if already authenticated
            if (sessionStorage.getItem('auth_lucas_gil') === 'true') {
                unlockApp();
            }

            function handleLogin() {
                if (input.value === CLIENT_PASSWORD) {
                    sessionStorage.setItem('auth_lucas_gil', 'true');
                    unlockApp();
                } else {
                    input.parentElement.classList.add('shake');
                    errorMsg.style.opacity = '1';
                    setTimeout(() => {
                        input.parentElement.classList.remove('shake');
                    }, 400);
                }
            }

            submitBtn.addEventListener('click', handleLogin);
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleLogin();
                // Hide error on typing
                errorMsg.style.opacity = '0';
            });

            function unlockApp() {
                gate.style.display = 'none';
                app.style.display = 'flex';
                fetchData();
            }

            async function fetchData() {
                const container = document.getElementById('pipeline-container');
                try {
                    const response = await fetch(DATA_URL);
                    if (!response.ok) throw new Error('Network response was not ok');
                    const data = await response.json();
                    
                    if (data && data.stages && data.stages.length > 0) {
                        renderPipeline(data.stages, container);
                    } else {
                        container.innerHTML = '<div class="error-state">No status updates currently available.</div>';
                    }
                } catch (error) {
                    console.error('Error fetching data:', error);
                    container.innerHTML = '<div class="error-state">Status information is currently unavailable. Please contact your advisor.</div>';
                }
            }

            function getStatusClass(status) {
                const s = (status || '').toLowerCase();
                if (s.includes('complete')) return 'status-complete';
                if (s.includes('in progress')) return 'status-in-progress';
                if (s.includes('hold')) return 'status-on-hold';
                if (s.includes('revision')) return 'status-needs-revision';
                if (s.includes('decision')) return 'status-decision-pending';
                return 'status-pending';
            }

            function renderPipeline(stages, container) {
                container.innerHTML = '';
                stages.forEach(stage => {
                    const stageEl = document.createElement('div');
                    stageEl.className = 'stage-item';
                    stageEl.setAttribute('data-status', stage.Status || 'Pending');

                    const statusClass = getStatusClass(stage.Status || '');

                    let notesHtml = '';
                    if (stage['Advisor Notes'] && stage['Advisor Notes'].trim() !== '') {
                        notesHtml = \`
                            <div class="advisor-notes">
                                <span class="advisor-notes-label">Advisor Notes</span>
                                \${escapeHtml(stage['Advisor Notes'])}
                            </div>
                        \`;
                    }

                    stageEl.innerHTML = \`
                        <div class="stage-marker"></div>
                        <div class="stage-header">
                            <div class="stage-name">\${escapeHtml(stage.Stage || 'Stage')}</div>
                            <div class="status-badge \${statusClass}">\${escapeHtml(stage.Status || 'Pending')}</div>
                        </div>
                        <div class="stage-meta">
                            <div class="meta-item">
                                <span class="meta-label">Last Updated</span>
                                <span class="meta-value">\${escapeHtml(stage['Last Updated'] || '—')}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Est. Completion</span>
                                <span class="meta-value">\${escapeHtml(stage['Est. Completion'] || '—')}</span>
                            </div>
                        </div>
                        \${notesHtml}
                    \`;
                    container.appendChild(stageEl);
                });
            }

            function escapeHtml(unsafe) {
                return (unsafe || '').toString()
                     .replace(/&/g, "&amp;")
                     .replace(/</g, "&lt;")
                     .replace(/>/g, "&gt;")
                     .replace(/"/g, "&quot;")
                     .replace(/'/g, "&#039;");
            }
        });
    </script>
</body>
</html>
